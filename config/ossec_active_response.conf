<!-- Tambahkan ke /var/ossec/etc/ossec.conf di wazuh-manager -->
<!-- Kelompok 6 MIKS ITS -->

<!-- SOAR: command definition -->
<command>
  <name>ddos-block</name>
  <executable>ddos-block.py</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<!-- SOAR: active response rule binding -->
<active-response>
  <command>ddos-block</command>
  <location>defined-agent</location>
  <agent_id>001</agent_id>
  <rules_id>31153,31103,100200,100201</rules_id>
  <timeout>600</timeout>
</active-response>
